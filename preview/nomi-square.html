<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方形 Nomi 预览</title>
<style>
:root{color-scheme:dark;--bg:#111318;--fg:#e8eaf0;--muted:#8b90a0;--card:#1b1e26;--accent:#6aa6ff}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
h1{font-size:18px;margin:0 0 4px}
p.sub{margin:0 0 14px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
button{background:var(--card);color:var(--fg);border:1px solid #2c3040;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
button.on{border-color:var(--accent);color:var(--accent)}
label{color:var(--muted);display:flex;gap:6px;align-items:center;margin-left:8px}
.grid{max-width:720px}
.card{background:var(--card);border-radius:12px;padding:12px}
.card canvas{width:100%;aspect-ratio:3/2;display:block;border-radius:6px;background:#000}
.card h2{font-size:14px;margin:10px 0 0}
.card span{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<h1>方形 Nomi 预览 · 480×320（ST7796S 实际分辨率，1:1 像素）</h1>
<p class="sub">纯 2D 矢量绘制，没有图片和 3D 资源，可以直接移植到 M5GFX。键盘 1–6 切换状态。</p>
<div class="bar" id="bar"></div>
<div class="grid" id="grid"></div>
<script>
const W=240,H=160,S=2;
const sp=(x,k=120,d=14)=>({x,v:0,t:x,k,d});
const stepSp=(s,dt)=>{s.v+=(s.t-s.x)*s.k*dt;s.v*=Math.exp(-s.d*dt);s.x+=s.v*dt};

const P={open:sp(1,260,18),gx:sp(0,90,12),gy:sp(0,90,12),mouth:sp(0,300,28),
  happy:sp(0,140,13),blush:sp(0,80,10),wide:sp(1,120,12),tilt:sp(0,100,12),
  cr:sp(90,60,16),cg:sp(170,60,16),cb:sp(255,60,16),hl:sp(0,120,13),hr:sp(0,120,13),smile:sp(0,140,13),bob:0};
const MODES=[['idle','待机'],['listen','聆听'],['think','思考'],['speak','说话'],['happy','开心'],['confused','疑惑']];
const COL={idle:[90,170,255],listen:[90,230,170],think:[255,200,80],speak:[255,120,190],happy:[255,150,90],confused:[180,140,255]};

let mode='idle',modeT=0,time=0,nextBlink=2,blinkT=-1,nextLook=1,look={x:0,y:0},auto=true,autoT=0;

function setMode(m){
  mode=m;modeT=0;const c=COL[m];P.cr.t=c[0];P.cg.t=c[1];P.cb.t=c[2];
  document.querySelectorAll('#bar button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
}

function tick(dt){
  time+=dt;modeT+=dt;autoT+=dt;
  if(auto&&autoT>3.5){autoT=0;setMode(MODES[(MODES.findIndex(x=>x[0]===mode)+1)%MODES.length][0])}
  nextBlink-=dt;if(nextBlink<0){blinkT=0;nextBlink=2+Math.random()*3.5}
  let blink=false;if(blinkT>=0){blinkT+=dt;blink=blinkT<.11;if(blinkT>.22)blinkT=-1}
  P.open.t=blink?.02:(mode==='think'?.72:1);
  P.wide.t=mode==='listen'?1.15:1;
  P.happy.t=P.blush.t=mode==='happy'?1:0;
  P.tilt.t=mode==='confused'?.3*Math.sin(time*2):(mode==='think'?-.12:0);
  nextLook-=dt;if(nextLook<0){look.x=Math.random()*2-1;look.y=(Math.random()*2-1)*.6;nextLook=1+Math.random()*2.2}
  let gx=0,gy=0;
  if(mode==='idle'){gx=look.x;gy=look.y}
  else if(mode==='think'){gx=-.7;gy=-.8}
  else if(mode==='speak'){gx=Math.sin(time*.9)*.25}
  else if(mode==='confused'){gx=Math.sin(time*2.4)*.8}
  P.gx.t=gx;P.gy.t=gy;
  let mo=0;
  if(mode==='speak'&&Math.sin(time*1.3)>-.7)
    mo=Math.min(1,Math.max(0,.45+.4*Math.sin(time*11)*Math.sin(time*4.3)+.15*Math.sin(time*23)));
  P.mouth.t=mo;
  P.smile.t=mode==='happy'||mode==='speak'?1:0;
  P.hl.t=mode==='speak'||mode==='happy'?1:0;
  P.hr.t=mode==='idle'?0:1;
  P.bob=Math.sin(time*1.7)*1.5-(mode==='listen'?2:0)
    -(mode==='happy'?Math.abs(Math.sin(modeT*9))*7*Math.exp(-modeT*1.2):0);
  for(const k in P)if(typeof P[k]==='object')stepSp(P[k],dt);
}

const col=(p,m,a=1)=>`rgba(${p.cr.x*m|0},${p.cg.x*m|0},${p.cb.x*m|0},${a})`;
const tilt=(c,p)=>{c.translate(W/2,H/2);c.rotate(p.tilt.x*.3);c.translate(-W/2,-H/2)};
const circ=(c,x,y,rx,ry=rx)=>{c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.fill()};

function overlay(c,t,noRipple){
  if(mode==='think'){
    c.fillStyle='rgba(255,255,255,.8)';
    for(let i=0;i<3;i++)circ(c,200+i*10,18-Math.max(0,Math.sin(t*6-i*.9))*5,2.5);
  }
  if(mode==='listen'&&!noRipple){
    c.lineWidth=2;
    for(let i=0;i<2;i++){
      const ph=(t*.9+i*.5)%1;
      c.strokeStyle=`rgba(255,255,255,${(1-ph)*.45})`;
      c.beginPath();c.arc(W/2,H-4,10+ph*45,Math.PI*1.15,Math.PI*1.85);c.stroke();
    }
  }
}

const hand=(c,x,y,rot,flip)=>{
  c.save();c.translate(x,y);c.rotate(rot);c.scale(flip,1);c.fillStyle='#fff';
  c.beginPath();c.ellipse(0,0,11,8,0,0,7);c.fill();
  c.beginPath();c.ellipse(-9,-6,3.5,5,-.6,0,7);c.fill();
  for(let i=0;i<3;i++){c.beginPath();c.ellipse(8,-5+i*5,4.5,2.6,0,0,7);c.fill()}
  c.restore();
};
const star=(c,x,y,r)=>{
  c.beginPath();
  for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,rr=i%2?r*.28:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}
  c.closePath();c.fill();
};

// A · Nomi（对照官方宣传图）：黑色圆脸 + 玻璃边框，纯白扁平五官，会伸手
function drawA(c,p,t){
  const cx=W/2,cy=H/2;
  const bob=p.bob,wide=p.wide.x,op=p.open.x,hp=p.happy.x,gx=p.gx.x,gy=p.gy.x,mo=p.mouth.x;
  c.save();
  c.fillStyle='#08080a';c.fillRect(0,0,W,H);
  c.translate(cx,cy);c.rotate(p.tilt.x*.3);c.translate(-cx,-cy);
  c.fillStyle='#fff';c.strokeStyle='#fff';c.lineCap='round';c.lineWidth=4;
  for(const s of[-1,1]){
    const sm=p.smile.x,x=cx+s*30+gx*8,y=cy-10+bob+gy*4-mo*3,w=9*wide;
    if(sm<.5){const h=Math.max(3,22*wide*op*(1-sm*2));c.beginPath();c.roundRect(x-w/2,y-h/2,w,h,Math.min(w,h)/2);c.fill()}
    else{c.beginPath();c.arc(x,y+4,9*(sm-.5)*2*(1+mo*.25),Math.PI*1.1,Math.PI*1.9);c.stroke()}
  }
  if(p.blush.x>.01)for(const s of[-1,1]){
    const g=c.createRadialGradient(cx+s*44,cy+10,0,cx+s*44,cy+10,11);
    g.addColorStop(0,`rgba(235,235,245,${.4*p.blush.x})`);g.addColorStop(1,'rgba(235,235,245,0)');
    c.fillStyle=g;circ(c,cx+s*44,cy+10,11);
  }
  c.fillStyle='#fff';
  if(hp>.05){
    c.save();
    for(const [dx,dy,r,ph] of[[40,-28,6,0],[-42,-20,4.5,1.7],[30,-8,3,3.1]]){
      c.globalAlpha=hp*(.55+.45*Math.sin(t*5+ph));star(c,cx+dx,cy+dy+bob,r);
    }
    c.restore();
  }
  [[-1,p.hl.x],[1,p.hr.x]].forEach(([s,v])=>{
    if(v<.02)return;
    let x=cx+s*44,y=178-v*62,rot=0;
    if(mode==='think'&&s===1)x=cx+10;
    if(mode==='listen'){x=cx+64;y=cy+8+(1-v)*90;rot=Math.PI/2*.85+Math.sin(t*3)*.06}
    if(mode==='speak'){
      if(s===1){
        x=cx+30;y-=mo*3;
        if(v>.3){
          c.save();c.strokeStyle='#fff';c.lineWidth=4;c.lineCap='round';
          c.beginPath();c.moveTo(x+2,y-17);c.lineTo(x,y-3);c.stroke();
          c.fillStyle='#fff';circ(c,x+2,y-24,6.5);c.fillStyle='#08080a';circ(c,x+2,y-24,2.2);
          c.restore();
        }
      }else{y-=mo*10;rot=-mo*.35}
    }
    if(mode==='happy')rot=Math.sin(t*10+s)*.4;
    if(mode==='confused'&&s===1)rot=Math.sin(t*8)*.3;
    hand(c,x,y,rot,-s);
  });
  c.restore();
  overlay(c,t,true);
}

// B · 几何变形：圆 → 胶囊 → 半圆，颜色随状态渐变
function drawB(c,p,t){
  c.fillStyle=col(p,.16);c.fillRect(0,0,W,H);
  c.save();tilt(c,p);
  const bob=p.bob,wide=p.wide.x,op=Math.max(p.open.x,.04),hp=p.happy.x,gx=p.gx.x,gy=p.gy.x,mo=p.mouth.x;
  c.fillStyle=col(p,1);
  for(const s of[-1,1]){
    const x=W/2+s*46+gx*10,y=50+bob+gy*7,w=30*wide;
    const hh=Math.max(4,32*wide*op)*(1-hp*.45);
    const rt=Math.min(w,hh)/2+ (w>hh?0:0),rb=Math.min(w,hh)/2*(1-hp*.9);
    c.beginPath();c.roundRect(x-w/2,y-hh/2+hp*6,w,hh,[rt,rt,rb,rb]);c.fill();
  }
  if(p.blush.x>.01){
    c.fillStyle=`rgba(255,122,168,${.5*p.blush.x})`;
    circ(c,W/2-70,84+bob,10,6);circ(c,W/2+70,84+bob,10,6);
  }
  c.fillStyle=col(p,1);
  const mh=5+mo*26+hp*8,mw=22+hp*18-mo*4,rt=mh/2*(1-hp*.85);
  c.beginPath();c.roundRect(W/2-mw/2+gx*4,100+bob-mh/2+hp*3,mw,mh,[rt,rt,mh/2,mh/2]);c.fill();
  c.restore();overlay(c,t);
}

// C · 圆脸小动物：橙色脸、腮红、大黑眼睛
function drawC(c,p,t){
  c.fillStyle='#2b1d1a';c.fillRect(0,0,W,H);
  c.save();tilt(c,p);
  const bob=p.bob,wide=p.wide.x,op=p.open.x,hp=p.happy.x,gx=p.gx.x,gy=p.gy.x,mo=p.mouth.x,hb=bob*.5;
  for(const s of[-1,1]){
    c.fillStyle='#d9692f';circ(c,W/2+s*72,30+bob*.4,20);
    c.fillStyle='#3a2118';circ(c,W/2+s*72,31+bob*.4,10);
  }
  c.fillStyle='#e8854a';circ(c,W/2,76+hb,98,54);
  c.fillStyle='#fbe9d6';
  circ(c,W/2-52,86+hb,28,18);circ(c,W/2+52,86+hb,28,18);circ(c,W/2,92+hb,30,20);
  c.fillStyle=`rgba(255,110,140,${.25+.45*p.blush.x})`;
  circ(c,W/2-62,80+hb,10,6);circ(c,W/2+62,80+hb,10,6);
  for(const s of[-1,1]){
    const x=W/2+s*38+gx*5,y=64+bob+gy*4,r=9*wide,ry=Math.max(1,r*1.25*op);
    c.save();c.globalAlpha=1-hp;
    c.fillStyle='#2a1410';circ(c,x,y,r,ry);
    c.fillStyle='#fff';circ(c,x-r*.35,y-ry*.4,r*.35,ry*.28);circ(c,x+r*.4,y+ry*.35,r*.15,ry*.12);
    c.restore();
    if(hp>.01){
      c.save();c.globalAlpha=hp;c.strokeStyle='#2a1410';c.lineWidth=4;c.lineCap='round';
      c.beginPath();c.arc(x,y+4,10,Math.PI*1.1,Math.PI*1.9);c.stroke();c.restore();
    }
  }
  c.fillStyle='#2a1410';circ(c,W/2,82+hb+gy*2,6,4.5);
  const y0=88+hb,open=Math.min(1,mo*6);
  c.save();c.lineCap='round';c.strokeStyle='#2a1410';c.lineWidth=2.5;
  c.globalAlpha=(1-hp)*(1-open);
  c.beginPath();c.arc(W/2-5,y0,5,Math.PI*.1,Math.PI*.9);c.stroke();
  c.beginPath();c.arc(W/2+5,y0,5,Math.PI*.1,Math.PI*.9);c.stroke();
  c.globalAlpha=hp*(1-open);
  c.beginPath();c.arc(W/2,y0-2,11,Math.PI*.15,Math.PI*.85);c.stroke();
  c.globalAlpha=open;c.fillStyle='#7a1f2b';circ(c,W/2,y0+6+mo*5,7+mo*3+hp*3,2+mo*10);
  c.fillStyle='#ff8fa3';circ(c,W/2,y0+9+mo*9,4,1+mo*3);
  c.restore();c.restore();overlay(c,t);
}

const STYLES=[
  ['方形 Nomi','整块屏就是脸：黑底、白色扁平五官、弧线眼、小手和麦克风',drawA]
];
const grid=document.getElementById('grid'),cvs=[];
for(const [name,desc,fn] of STYLES){
  const d=document.createElement('div');d.className='card';
  d.innerHTML=`<canvas width="${W*S}" height="${H*S}"></canvas><h2>${name}</h2><span>${desc}</span>`;
  grid.appendChild(d);
  const ctx=d.querySelector('canvas').getContext('2d');ctx.scale(S,S);
  cvs.push([ctx,fn]);
}
const bar=document.getElementById('bar');
MODES.forEach(([m,label],i)=>{
  const b=document.createElement('button');b.textContent=`${i+1} ${label}`;b.dataset.m=m;
  b.onclick=()=>{auto=false;autoCb.checked=false;setMode(m)};bar.appendChild(b);
});
const lab=document.createElement('label');
lab.innerHTML='<input type="checkbox" checked> 自动轮播';bar.appendChild(lab);
const autoCb=lab.querySelector('input');autoCb.onchange=()=>{auto=autoCb.checked;autoT=0};
addEventListener('keydown',e=>{const i=+e.key-1;if(i>=0&&i<MODES.length){auto=false;autoCb.checked=false;setMode(MODES[i][0])}});

setMode('idle');
let last=performance.now(),acc=0;
(function loop(now){
  acc+=Math.min(.1,(now-last)/1000);last=now;
  while(acc>=1/60){tick(1/60);acc-=1/60}
  for(const [ctx,fn] of cvs){ctx.save();fn(ctx,P,time);ctx.restore()}
  requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
